name: Проверка лендинга

on:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Операция на dev.chanly.ru
        type: choice
        options: [release, rollback]
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Проверить код
        run: npm run lint
      - name: Проверить компоненты
        run: npm test
      - name: Собрать сайт
        run: npm run build
        env:
          VITE_AUTH_URL: /auth/login
      - name: Проверить и упаковать сборку
        id: package
        run: |
          test -s dist/index.html
          for extension in js css svg; do
            asset=$(grep -oE "/landing-assets/[^\" ]+\.$extension" dist/index.html | head -1)
            test -n "$asset" && test -s "dist$asset" || exit 1
          done
          test ! -d dist/assets
          tar -czf landing.tar.gz -C dist .
          digest=$(sha256sum landing.tar.gz | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA run=$GITHUB_RUN_ID sha256=$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: landing-${{ github.run_id }}-${{ github.run_attempt }}
          path: landing.tar.gz
          retention-days: 14
          if-no-files-found: error
